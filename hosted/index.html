<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qlik Tools</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f0eeea;
      --surface: #ffffff;
      --border: rgba(0,0,0,0.09);
      --border-hover: rgba(0,0,0,0.18);
      --text: #1a1a18;
      --muted: #6b6a65;
      --accent: #0060a9;
      --accent-hover: #004e8a;
      --radius: 12px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141412;
        --surface: #1e1d1a;
        --border: rgba(255,255,255,0.08);
        --border-hover: rgba(255,255,255,0.18);
        --text: #f0eeea;
        --muted: #908e87;
        --accent: #3b9eff;
        --accent-hover: #60b0ff;
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 48px 24px 32px;
      max-width: 720px;
      margin: 0 auto;
      width: 100%;
    }

    .wordmark {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
    }

    .wordmark-icon {
      width: 32px;
      height: 32px;
      background: var(--accent);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .wordmark-icon svg {
      width: 18px;
      height: 18px;
      fill: #fff;
    }

    .wordmark-text {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    h1 {
      font-size: clamp(28px, 5vw, 40px);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.15;
      margin-bottom: 12px;
    }

    .subtitle {
      font-size: 16px;
      color: var(--muted);
      line-height: 1.6;
    }

    main {
      flex: 1;
      max-width: 720px;
      margin: 0 auto;
      width: 100%;
      padding: 0 24px 64px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      margin-top: 8px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
    }

    .card:hover {
      border-color: var(--border-hover);
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      transform: translateY(-2px);
    }

    .card-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: rgba(0, 96, 169, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    @media (prefers-color-scheme: dark) {
      .card-icon { background: rgba(59, 158, 255, 0.12); }
    }

    .card-icon svg {
      width: 20px;
      height: 20px;
      stroke: var(--accent);
      fill: none;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .card-title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .card-desc {
      font-size: 13.5px;
      color: var(--muted);
      line-height: 1.55;
    }

    .card-arrow {
      margin-top: auto;
      padding-top: 8px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .card-arrow svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    footer {
      text-align: center;
      padding: 24px;
      font-size: 13px;
      color: var(--muted);
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>

  <header>
    <div class="wordmark">
      <div class="wordmark-icon">
        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      </div>
      <span class="wordmark-text">Qlik Tools</span>
    </div>
    <h1>Developer utilities</h1>
    <p class="subtitle">Self-contained tools for working with Qlik Cloud.</p>
  </header>

  <main>
    <div class="grid">

      <a href="automate-bookmarklet-generator.html" class="card">
        <div class="card-icon">
          <svg viewBox="0 0 24 24">
            <path d="M5 3a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2H5z"/>
            <path d="M9 9h6M9 12h6M9 15h4"/>
          </svg>
        </div>
        <div class="card-title">Automate Bookmarklet Generator</div>
        <div class="card-desc">Generate browser bookmarklets to trigger Qlik Automate workflows directly from your browser toolbar.</div>
        <div class="card-arrow">
          Open tool
          <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </div>
      </a>

    </div>
  </main>

  <footer>
    Built for Qlik &mdash; <a href="https://github.com/withdave/qlik" style="color:var(--accent);text-decoration:none;">GitHub</a>
  </footer>

</body>
</html>
